services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integrity
      POSTGRES_USER: integrity
      POSTGRES_PASSWORD: integrity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrity -d integrity"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://integrity:integrity@postgres:5432/integrity
      REDIS_URL: redis://redis:6379/0
      SECRET_PEPPER: change-this-pepper-outside-dev
      WASM_ENVELOPE_KEY: local-dev-wasm-envelope-key
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
